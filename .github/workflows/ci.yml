name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files
        run: |
          set -euo pipefail
          for f in SKILL.md README.md README_zh.md CHANGELOG.md LICENSE install.sh scripts/inventory.py scripts/validate-command-schema.py scripts/validate-references.py scripts/validate-markdown-links.py scripts/token-benchmark.py scripts/validate-installer-sources.py docs/workflows.md docs/token-cost.md docs/install.md docs/language-reference.md; do
            test -f "$f" || { echo "missing: $f"; exit 1; }
          done

      - name: Validate command schema
        run: python3 scripts/validate-command-schema.py

      - name: Validate command references
        run: python3 scripts/validate-references.py

      - name: Validate markdown links
        run: python3 scripts/validate-markdown-links.py

      - name: Validate installer source pins
        run: python3 scripts/validate-installer-sources.py

      - name: Compile validation scripts
        run: python3 -m py_compile scripts/*.py

      - name: Run validation script tests
        run: |
          python3 -m pip install pytest
          pytest

      - name: Check token-efficiency guardrails
        run: |
          set -euo pipefail
          if grep -R "Load skill first" commands SKILL.md docs README.md README_zh.md; then
            echo "redundant skill-loading footer found"
            exit 1
          fi
          skill_lines=$(wc -l < SKILL.md)
          if [ "$skill_lines" -gt 260 ]; then
            echo "SKILL.md too large: ${skill_lines} lines"
            exit 1
          fi

      - name: Check shell syntax
        run: bash -n install.sh

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint shell script
        run: |
          set -euo pipefail
          shellcheck install.sh
        shell: bash

      - name: Validate installer dry-run
        run: bash install.sh --minimal --dry-run

      - name: Validate recommended installer dry-run
        run: bash install.sh --recommended --dry-run

      - name: Validate full installer dry-run
        run: bash install.sh --full --dry-run

      - name: Generate static token benchmark
        run: python3 scripts/token-benchmark.py
